name: Deploy - EC2 Quickstart

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-ec2-quickstart
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2 via AWS SSM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_EC2_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Dispatch Update via AWS SSM (Target by Tag)
        run: |
          echo "Looking for instances with tag Name=nextstep-quickstart..."
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=nextstep-quickstart" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Error: no running EC2 instance found with tag Name=nextstep-quickstart"
            exit 1
          fi

          echo "Target EC2 instance found: $INSTANCE_ID"

          echo "Sending deployment command via AWS Systems Manager (SSM)..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy commit ${{ github.sha }}" \
            --parameters 'commands=[
              "set -euo pipefail",
              "cd /opt/nextstep",
              "git fetch origin main",
              "git reset --hard origin/main",
              "docker compose -f docker-compose.yml -f docker-compose.prod.yml build backend",
              "docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d db keycloak --wait",
              "docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --no-deps -T backend --migrate",
              "docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command dispatched with ID: $COMMAND_ID"
          echo "Waiting for command execution on instance..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "Command execution finished with status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "Deployment command failed. Fetching output:"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi

          echo "EC2 Quickstart updated successfully"
