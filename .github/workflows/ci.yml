# =============================================================================
# .github/workflows/ci.yml
# NextStep — Pipeline CI (orchestrateur)
#
# Ce fichier ne fait qu'ordonner les jobs. Chaque composant a son propre
# workflow réutilisable dans ce dossier :
#
#   _ci-agents.yml    → ruff + pytest + couverture Codecov
#   _ci-frontend.yml  → tsc + Vitest + build Angular
#   _ci-backend.yml   → build .NET + tests xUnit
#   _ci-docker.yml    → validation docker compose + build des 3 images
#   _ci-sonar.yml     → SonarQube (ignoré si non configuré)
#
# Pour ajouter un composant : créer son _ci-<nom>.yml avec `on: workflow_call`
# puis l'ajouter dans la liste `jobs:` ci-dessous et dans le tableau du résumé.
#
# Les déploiements (deploy-ec2.yml, deploy-fargate.yml) sont déclenchés par le
# CD, pas par ce fichier.
# =============================================================================

name: CI — NextStep

on:
  push:
    branches:
      - main
      - dev
      - "feature-*"
      - "fix/*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents:
    name: "🐍 Agents Python"
    uses: ./.github/workflows/_ci-agents.yml

  frontend:
    name: "🅰️ Frontend Angular"
    uses: ./.github/workflows/_ci-frontend.yml

  backend:
    name: "🔷 Backend .NET"
    uses: ./.github/workflows/_ci-backend.yml

  docker:
    name: "🐳 Docker Compose"
    uses: ./.github/workflows/_ci-docker.yml

  # ───────────────────────────────────────────────────────────────────────────
  # RÉSUMÉ — point de contrôle unique required dans les règles de branche.
  # Échoue si un seul composant a échoué (les jobs "skipped" ne bloquent pas).
  # ───────────────────────────────────────────────────────────────────────────
  summary:
    name: "📋 CI Summary"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [agents, frontend, backend, docker]
    if: always()
    permissions:
      contents: read

    steps:
      - name: "📋 Rapport"
        env:
          R_AGENTS: ${{ needs.agents.result }}
          R_FRONTEND: ${{ needs.frontend.result }}
          R_BACKEND: ${{ needs.backend.result }}
          R_DOCKER: ${{ needs.docker.result }}
        run: |
          status() {
            case "$1" in
              success) echo "✅ Succès" ;;
              skipped) echo "⏭️ Ignoré" ;;
              *)       echo "❌ Échec" ;;
            esac
          }

          {
            echo "## 📊 Résultats CI NextStep"
            echo ""
            echo "| Composant | Statut |"
            echo "|-----------|--------|"
            echo "| 🐍 Agents Python   | $(status "$R_AGENTS")   |"
            echo "| 🅰️ Frontend Angular | $(status "$R_FRONTEND") |"
            echo "| 🔷 Backend .NET     | $(status "$R_BACKEND")   |"
            echo "| 🐳 Docker Compose   | $(status "$R_DOCKER")    |"
            echo ""
            echo "**Branche :** \`${{ github.ref_name }}\`"
            echo "**Commit :** \`${{ github.sha }}\`"
            echo "**Déclenché par :** @${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "❌ Échouer si un composant est en échec"
        if: >-
          needs.agents.result == 'failure' ||
          needs.frontend.result == 'failure' ||
          needs.backend.result == 'failure' ||
          needs.docker.result == 'failure'
        run: |
          echo "::error::Un ou plusieurs composants CI ont échoué."
          exit 1

  # Analyse SonarQube — ignorée tant qu'aucune instance n'est configurée.
  sonar:
    name: "🔍 SonarQube"
    needs: [agents, frontend, backend]
    if: >-
      always() &&
      (needs.agents.result == 'success' ||
       needs.frontend.result == 'success' ||
       needs.backend.result == 'success')
    uses: ./.github/workflows/_ci-sonar.yml
