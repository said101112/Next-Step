# =============================================================================
# .github/workflows/_ci-docker.yml
# Job réutilisable — validation Docker Compose et images
#
# Appelé par ci.yml. Ne se déclenche pas directement.
# =============================================================================

name: ci-docker

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci-docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Valider docker compose (dev et prod)
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          echo "docker compose dev/prod valides"

      - name: Construire les images (sans démarrage)
        run: |
          docker build -f backend/Dockerfile   -t nextstep-backend:ci   backend/
          docker build -f agents/Dockerfile    -t nextstep-agents:ci    agents/
          docker build -f frontend/Dockerfile -t nextstep-frontend:ci frontend/
          echo "Images backend/agents/frontend construites"
