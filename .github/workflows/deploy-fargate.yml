name: Deploy - Enterprise Fargate (Manual Trigger Only)

on:
  # push:
  #   branches:
  #     - main
  #     - dev
  #     - staging
  #   paths:
  #     - "backend/**"
  #     - "frontend/**"
  #     - "agents/**"
  #     - "infra/aws/enterprise-fargate/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-fargate-${{ github.ref_name }}-${{ github.event.inputs.environment || 'auto' }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. STAGING DEPLOYMENT
  # Triggered automatically on push to 'dev' / 'staging', or manually
  # =========================================================================
  deploy-staging:
    name: Deploy - Staging
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'staging'
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_FARGATE_STAGING_ROLE_ARN || vars.AWS_FARGATE_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Images to ECR (Staging)
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          PROJECT: nextstep/staging
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building and pushing .NET Backend (API) for Staging..."
          docker build -t $REGISTRY/$PROJECT/api:$IMAGE_TAG -t $REGISTRY/$PROJECT/api:latest ./backend
          docker push $REGISTRY/$PROJECT/api:$IMAGE_TAG
          docker push $REGISTRY/$PROJECT/api:latest

          echo "Building and pushing Python Agents (Worker) for Staging..."
          docker build -t $REGISTRY/$PROJECT/worker:$IMAGE_TAG -t $REGISTRY/$PROJECT/worker:latest ./agents
          docker push $REGISTRY/$PROJECT/worker:$IMAGE_TAG
          docker push $REGISTRY/$PROJECT/worker:latest

          echo "Building and pushing Angular Frontend (Nginx) for Staging..."
          docker build -t $REGISTRY/$PROJECT/nginx:$IMAGE_TAG -t $REGISTRY/$PROJECT/nginx:latest ./frontend
          docker push $REGISTRY/$PROJECT/nginx:$IMAGE_TAG
          docker push $REGISTRY/$PROJECT/nginx:latest

      - name: Update ECS Staging Service
        run: |
          echo "Triggering rolling update on ECS Staging Service..."
          aws ecs update-service \
            --cluster nextstep-staging-cluster \
            --service nextstep-staging-service \
            --force-new-deployment

      - name: Wait for Staging Stability
        run: |
          echo "Waiting for Staging tasks to stabilize..."
          aws ecs wait services-stable \
            --cluster nextstep-staging-cluster \
            --services nextstep-staging-service
          echo "Staging environment deployed successfully"

  # =========================================================================
  # 2. PRODUCTION DEPLOYMENT
  # Triggered automatically on push to 'main', or manually
  # =========================================================================
  deploy-production:
    name: Deploy - Production
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'production'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_FARGATE_PROD_ROLE_ARN || vars.AWS_FARGATE_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Images to ECR (Production)
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          PROJECT: nextstep/production
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building and pushing .NET Backend (API) for Production..."
          docker build -t $REGISTRY/$PROJECT/api:$IMAGE_TAG -t $REGISTRY/$PROJECT/api:latest ./backend
          docker push $REGISTRY/$PROJECT/api:$IMAGE_TAG
          docker push $REGISTRY/$PROJECT/api:latest

          echo "Building and pushing Python Agents (Worker) for Production..."
          docker build -t $REGISTRY/$PROJECT/worker:$IMAGE_TAG -t $REGISTRY/$PROJECT/worker:latest ./agents
          docker push $REGISTRY/$PROJECT/worker:$IMAGE_TAG
          docker push $REGISTRY/$PROJECT/worker:latest

          echo "Building and pushing Angular Frontend (Nginx) for Production..."
          docker build -t $REGISTRY/$PROJECT/nginx:$IMAGE_TAG -t $REGISTRY/$PROJECT/nginx:latest ./frontend
          docker push $REGISTRY/$PROJECT/nginx:$IMAGE_TAG
          docker push $REGISTRY/$PROJECT/nginx:latest

      - name: Update ECS Production Service
        run: |
          echo "Triggering zero-downtime rolling update on ECS Production Service..."
          aws ecs update-service \
            --cluster nextstep-production-cluster \
            --service nextstep-production-service \
            --force-new-deployment

      - name: Wait for Production Stability
        run: |
          echo "Waiting for Production tasks to stabilize..."
          aws ecs wait services-stable \
            --cluster nextstep-production-cluster \
            --services nextstep-production-service
          echo "Production environment deployed successfully with zero downtime"
