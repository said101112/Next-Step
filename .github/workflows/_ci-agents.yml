# =============================================================================
# .github/workflows/_ci-agents.yml
# Job réutilisable — Agents Python (ruff + pytest + couverture)
#
# Appelé par ci.yml. Ne se déclenche pas directement.
# =============================================================================

name: ci-agents

on:
  workflow_call:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

defaults:
  run:
    working-directory: agents

jobs:
  ci-agents:
    name: "🐍 Agents Python"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: agents/requirements.txt

      - name: "📦 Installer les dépendances"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx ruff

      - name: "🔍 Lint — Ruff"
        run: ruff check app/ tests/

      - name: "✅ Vérifier les imports critiques"
        run: |
          python -c "
          from app.domain.offer_analyzer.schemas.state import OfferAnalyzerState
          from app.domain.offer_analyzer.agents.agent import offer_analyzer_node
          from app.domain.profile_retriever.service import ProfileRetrieverService
          from app.domain.pipeline.workflow import build_offer_pipeline
          from app.core.utils.normalizer import normalize_skills

          build_offer_pipeline()
          print('✅ Architecture Domain-Driven (Service-Based) OK')
          "

      - name: "🧪 Tests + couverture"
        env:
          LLM_PROVIDER: "groq"
          GROQ_API_KEY: "test-key-not-real"
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test_db"
        run: python -m pytest tests -v --tb=short --cov=app --cov-report=term-missing --cov-report=xml

      - name: "📤 Upload coverage to Codecov"
        uses: codecov/codecov-action@v4
        with:
          files: agents/coverage.xml
          flags: agents
          fail_ci_if_error: false
